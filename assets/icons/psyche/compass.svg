<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Classic Compass - clearly recognizable like 🧭 -->
  
  <!-- Outer circle (bezel) -->
  <circle cx="50" cy="50" r="48" fill="none" stroke="#000000" stroke-width="4"/>
  
  <!-- Inner circle -->
  <circle cx="50" cy="50" r="40" fill="none" stroke="#000000" stroke-width="2"/>
  
  <!-- Main compass needle - North (prominent, filled) -->
  <path d="
    M 50 12
    L 58 48
    L 50 42
    L 42 48
    Z
  " fill="#000000"/>
  
  <!-- South needle -->
  <path d="
    M 50 88
    L 58 52
    L 50 58
    L 42 52
    Z
  " fill="#000000"/>
  
  <!-- East pointer -->
  <path d="M 88 50 L 52 42 L 52 58 Z" fill="#000000"/>
  
  <!-- West pointer -->
  <path d="M 12 50 L 48 42 L 48 58 Z" fill="#000000"/>
  
  <!-- Diagonal pointers (NE, SE, SW, NW) - smaller -->
  <path d="M 82 18 L 58 40 L 62 44 Z" fill="#000000"/>
  <path d="M 82 82 L 58 60 L 62 56 Z" fill="#000000"/>
  <path d="M 18 82 L 42 60 L 38 56 Z" fill="#000000"/>
  <path d="M 18 18 L 42 40 L 38 44 Z" fill="#000000"/>
  
  <!-- Center pivot circle -->
  <circle cx="50" cy="50" r="8" fill="#000000"/>
  <circle cx="50" cy="50" r="4" fill="#000000"/>
  
  <!-- Degree marks around edge -->
  <line x1="50" y1="2" x2="50" y2="10" stroke="#000000" stroke-width="3"/>
  <line x1="50" y1="90" x2="50" y2="98" stroke="#000000" stroke-width="2"/>
  <line x1="2" y1="50" x2="10" y2="50" stroke="#000000" stroke-width="2"/>
  <line x1="90" y1="50" x2="98" y2="50" stroke="#000000" stroke-width="2"/>
  
  <!-- Small tick marks -->
  <line x1="50" y1="4" x2="50" y2="8" stroke="#000000" stroke-width="1"/>
  <line x1="71" y1="8" x2="68" y2="12" stroke="#000000" stroke-width="1"/>
  <line x1="29" y1="8" x2="32" y2="12" stroke="#000000" stroke-width="1"/>
  <line x1="92" y1="29" x2="88" y2="32" stroke="#000000" stroke-width="1"/>
  <line x1="92" y1="71" x2="88" y2="68" stroke="#000000" stroke-width="1"/>
  <line x1="8" y1="29" x2="12" y2="32" stroke="#000000" stroke-width="1"/>
  <line x1="8" y1="71" x2="12" y2="68" stroke="#000000" stroke-width="1"/>
</svg>
