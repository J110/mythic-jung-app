<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 120">
  <!-- Classic Lantern - clearly recognizable like 🏮 -->
  
  <!-- Handle/bail on top -->
  <path d="M 35 10 Q 35 0 50 0 Q 65 0 65 10" fill="none" stroke="#000000" stroke-width="5" stroke-linecap="round"/>
  
  <!-- Top cap -->
  <path d="
    M 50 5
    L 45 10
    L 30 12
    L 28 18
    L 72 18
    L 70 12
    L 55 10
    Z
  " fill="#000000"/>
  
  <!-- Top ring -->
  <rect x="25" y="18" width="50" height="8" rx="2" fill="#000000"/>
  
  <!-- Main body (glass/paper section) -->
  <path d="
    M 25 26
    L 22 90
    Q 22 95 28 98
    L 72 98
    Q 78 95 78 90
    L 75 26
    Z
  " fill="#000000"/>
  
  <!-- Vertical frame bars -->
  <rect x="25" y="26" width="4" height="72" fill="#000000"/>
  <rect x="48" y="26" width="4" height="72" fill="#000000"/>
  <rect x="71" y="26" width="4" height="72" fill="#000000"/>
  
  <!-- Horizontal frame bars -->
  <rect x="22" y="45" width="56" height="4" fill="#000000"/>
  <rect x="22" y="70" width="56" height="4" fill="#000000"/>
  
  <!-- Bottom base -->
  <path d="
    M 20 98
    L 22 108
    L 28 108
    L 30 100
    L 70 100
    L 72 108
    L 78 108
    L 80 98
    Z
  " fill="#000000"/>
  
  <!-- Feet -->
  <rect x="25" y="108" width="8" height="10" rx="2" fill="#000000"/>
  <rect x="67" y="108" width="8" height="10" rx="2" fill="#000000"/>
</svg>
